services:
  - type: web
    name: apex-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python apex.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "7985785104"
      - key: PYTHON_VERSION
        value: "3.11.11"